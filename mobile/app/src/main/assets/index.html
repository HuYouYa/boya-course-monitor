<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>博雅课程监控</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#172b4d;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{background:#075ca8;color:#fff;padding:22px 18px}.top h1{margin:0;font-size:23px}.top small{opacity:.85}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:17px;margin-bottom:14px;box-shadow:0 2px 12px #17324d12}.card h2{font-size:17px;margin:0 0 14px;border-left:4px solid #1682d4;padding-left:8px}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #ccd7e4;border-radius:8px;padding:11px;font-size:14px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ranges{display:grid;grid-template-columns:58px 1fr;gap:9px;align-items:center}.ranges label{font-weight:600;font-size:13px}.btn{border:0;border-radius:8px;padding:11px 14px;background:#0867b5;color:white;font-size:14px}.btn.secondary{background:#e8f1f9;color:#075ca8}.actions{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:12px;color:#728096;line-height:1.55}.status{background:#eef6fd;border-radius:8px;padding:10px;font-size:13px;white-space:pre-wrap;line-height:1.5}.course{border-top:1px solid #e6edf4;padding:12px 0;font-size:13px;line-height:1.7}.course:first-child{border-top:0}.course b{color:#075ca8;font-size:15px}.tag{background:#eaf4fc;color:#17669e;border-radius:12px;padding:2px 7px;font-size:11px;margin-left:5px}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><h1>博雅课程监控</h1><small>手机独立运行 · 电脑无需启动服务</small></header>
<main class="wrap">
<section class="card"><h2>博雅账号</h2><div class="grid"><div class="field"><label>账号</label><input id="username" autocomplete="username"></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password"></div></div><div class="grid"><div class="field"><label>上课形式</label><select id="delivery_mode"><option value="offline">线下</option><option value="online">线上</option></select></div><div class="field" id="campus-wrap"><label>线下校区</label><select id="campus"><option>学院路</option><option>沙河</option></select></div></div><p class="hint">密码只保存在本手机的 Android 加密存储中。首次运行请点“打开博雅登录”完成统一认证，后续由监控服务复用登录会话。</p></section>
<section class="card"><h2>通知配置</h2><div class="grid"><div class="field"><label>SMTP 主机</label><input id="smtp_host" placeholder="smtp.qq.com"></div><div class="field"><label>端口</label><input id="smtp_port" type="number" value="465"></div></div><div class="grid"><div class="field"><label>SMTP 用户名</label><input id="smtp_username"></div><div class="field"><label>SMTP 授权码</label><input id="smtp_password" type="password"></div></div><div class="grid"><div class="field"><label>发件人</label><input id="smtp_from"></div><div class="field"><label>普通邮箱收件地址</label><input id="smtp_to"></div></div><div class="field"><label>QQ 邮箱收件地址</label><input id="qq_to"></div><p class="hint">QQ 邮箱和普通邮箱均通过 SMTP 发送；QQ 通知填写 QQ 收件地址。授权码不会上传。</p></section>
<section class="card"><h2>每周空闲时间段</h2><p class="hint">支持多段，例如：09:00-12:00, 14:00-18:00</p><div class="ranges" id="ranges"></div></section>
<section class="card"><h2>监控</h2><div class="grid"><div class="field"><label>检查间隔（秒，至少 60）</label><input id="poll_interval" type="number" value="300"></div><div class="field"><label>通知邮箱</label><select id="notify_channel"><option value="email">普通邮箱</option><option value="qq">QQ 邮箱</option></select></div></div><div class="actions"><button class="btn" onclick="save()">保存配置</button><button class="btn" onclick="login()">打开博雅登录</button><button class="btn secondary" onclick="start()">启动监控</button><button class="btn secondary" onclick="stop()">停止监控</button><button class="btn secondary" onclick="run()">立即检查</button><button class="btn secondary" onclick="testMail()">测试通知</button></div><p class="status" id="status">正在读取状态…</p></section>
<section class="card"><h2>符合条件的课程</h2><div id="courses"><span class="hint">尚未检查</span></div></section>
</main><script>
const days=['周一','周二','周三','周四','周五','周六','周日'];
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function initRanges(c){let x=c.free_ranges||{};document.querySelector('#ranges').innerHTML=days.map((d,i)=>`<label>${d}</label><input id="r${i}" value="${esc(x[i]||'')}" placeholder="09:00-12:00, 14:00-18:00">`).join('')}
function fields(){let x={};['username','password','delivery_mode','campus','smtp_host','smtp_port','smtp_username','smtp_password','smtp_from','smtp_to','qq_to','poll_interval','notify_channel'].forEach(id=>x[id]=document.querySelector('#'+id).value.trim());x.free_ranges={};days.forEach((_,i)=>x.free_ranges[i]=document.querySelector('#r'+i).value.trim());return x}
function fill(c){for(const id of ['username','delivery_mode','campus','smtp_host','smtp_port','smtp_username','smtp_from','smtp_to','qq_to','poll_interval','notify_channel'])if(c[id]!=null)document.querySelector('#'+id).value=c[id];initRanges(c);toggle()}
function toggle(){document.querySelector('#campus-wrap').style.display=document.querySelector('#delivery_mode').value==='online'?'none':'block'}
function save(){Android.saveConfig(JSON.stringify(fields()));document.querySelector('#status').textContent='配置已保存。'}
function start(){save();Android.startMonitor()}
function stop(){Android.stopMonitor()}
function run(){save();Android.runNow()}
function testMail(){save();Android.testMail()}
function login(){save();Android.openLogin()}
function render(x){try{const s=JSON.parse(x);document.querySelector('#status').textContent=(s.running?'监控运行中':'监控未启动')+'\n上次检查：'+(s.last_run||'尚未检查')+(s.error?'\n错误：'+s.error:'')+'\n'+(s.message||'');const cs=s.courses||[];document.querySelector('#courses').innerHTML=cs.length?cs.map(c=>`<div class="course"><b>${esc(c.name)}</b><span class="tag">${esc((c.campus||[]).join('、')||'校区未标注')}</span><br>开课：${esc(c.start||'待公布')} → ${esc(c.end||'待公布')}<br>预选：${esc(c.select_start||'待公布')} → ${esc(c.select_end||'待公布')}<br>分类：${esc(c.category||'未标注')}　地点：${esc(c.position||'未标注')}<br>人数：${c.current_count??'未知'} / ${c.max_count??'未知'}</div>`).join(''):'<span class="hint">暂无符合条件的课程</span>'}catch(e){}}
document.querySelector('#delivery_mode').onchange=toggle;fill(JSON.parse(Android.getConfig()));setInterval(()=>render(Android.getStatus()),3000);render(Android.getStatus());
</script></body></html>
